name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job talks to the exchange, an LLM or Telegram (NFR-2): tests use recorded fixtures,
# httpx2.MockTransport and a loopback stub; a pytest guard fails any external connection.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: mypy --strict
        run: uv run mypy

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: import-linter (layer contracts)
        run: uv run lint-imports

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest --cov --cov-report=term
      - name: coverage of domain + application >= 90% (PLAN section 8)
        run: >-
          uv run coverage report --no-skip-covered --fail-under=90
          --include='*/guarded_exchange/domain/*,*/guarded_exchange/application/*'
      - name: traceability table is up to date
        run: |
          uv run pytest --collect-only -q --traceability=docs/traceability.md > /dev/null
          git diff --exit-code docs/traceability.md
